<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CC HS26</title>

  <meta name="title" content="BA Interaction Design : Creative Coding Portfolio" />

  <link rel="icon" type="image/x-icon" href="favicon/favicon.ico" />

  <style>

    @font-face {
      font-family: "Suisse";
      src: url("fonts/Suisse.ttf") format("truetype");
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Suisse", -apple-system, system-ui, sans-serif;
    }

    /* THREE PROJECT TILES */

    .split {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    .half {
      flex: 1;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      text-decoration: none;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* BACKGROUND IMAGE */

    .half::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image: inherit;
      background-size: cover;
      background-position: center;

      transition: transform 0.6s ease;
    }

    /* HOVER ZOOM */

    .half:hover::before {
      transform: scale(1.05);
    }

    /* PROJECT LABEL */

    .label {
      position: relative;
      z-index: 1;

      color: #fff;
      mix-blend-mode: difference;

      font-size: 5rem;
      font-weight: 800;
      letter-spacing: 0.05em;

      text-decoration: none;
      pointer-events: none;

      transition: transform 0.4s ease;
    }

    .half:hover .label {
      transform: scale(1.05);
    }

    /* MOBILE VERSION */

    @media (max-width: 700px) {

      .split {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      .half {
        min-height: 33.33vh;
      }

      .label {
        font-size: 3.5rem;
      }

    }

  </style>
</head>

<body>

  <div class="split">

    <!-- PROJECT 1 -->

    <a class="half"
       href="./projects/project1/index.html"
       style="background-image: url('./projects/project1/thumbnail.png')">

      <span class="label">Project 1</span>

    </a>


    <!-- PROJECT 2 -->

    <a class="half"
       href="./projects/project2/index.html"
       style="background-image: url('./projects/project2/thumbnail.png')">

    </a>


    <!-- PROJECT 3 -->

    <a class="half"
       href="./projects/project3/index.html"
       style="background-image: url('./projects/project3/thumbnail.png')">

      <span class="label">Project 3</span>

    </a>

  </div>

</body>

</html>
